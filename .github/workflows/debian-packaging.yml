name: Debian packaging

on:
  workflow_dispatch:
  push:
    branches:
      - linux_packaging
    tags:
      - "v*"

jobs:
  deb:
    name: Build .deb
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Debian packaging tools
        run: sudo apt-get update && sudo apt-get install -y debhelper devscripts dpkg-dev lintian

      - name: Install npm dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Build Debian package
        run: npm run package:linux:deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: tangent-deb
          path: apps/tangent-electron/dist/*.deb

      - name: Publish .deb to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_FLAGS=""
          if [[ "$GITHUB_REF_NAME" == *"alpha"* || "$GITHUB_REF_NAME" == *"beta"* || "$GITHUB_REF_NAME" == *"rc"* ]]; then
            RELEASE_FLAGS="--prerelease"
          fi

          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Tangent Debian package." $RELEASE_FLAGS
          fi
          gh release upload "$GITHUB_REF_NAME" apps/tangent-electron/dist/*.deb --clobber

  ppa-source:
    name: Prepare PPA source (${{ matrix.series }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        series: [noble, resolute]

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Debian packaging tools
        run: sudo apt-get update && sudo apt-get install -y debhelper devscripts dpkg-dev lintian

      - name: Install npm dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Prepare Launchpad source package
        run: npm run package:ppa-source -- --vendor-npm-cache --vendor-node
        env:
          UBUNTU_SERIES: ${{ matrix.series }}
          DEBFULLNAME: Tangent Maintainers
          DEBEMAIL: maintainer@ubuntu.com

      - name: Lint source package
        run: lintian dist/ppa-source/${{ matrix.series }}/*.changes || true

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: ppa-source-${{ matrix.series }}
          path: |
            dist/ppa-source/${{ matrix.series }}/*.dsc
            dist/ppa-source/${{ matrix.series }}/*.changes
            dist/ppa-source/${{ matrix.series }}/*.tar.*
