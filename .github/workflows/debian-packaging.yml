name: Debian packaging

on:
  workflow_dispatch:
  push:
    branches:
      - debian_packaging
    tags:
      - "v*"

jobs:
  dry-run:
    name: Build Debian artifacts
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        series: [noble, resolute]

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Debian packaging tools
        run: sudo apt-get update && sudo apt-get install -y debhelper devscripts dpkg-dev lintian

      - name: Install npm dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Build direct Debian package
        run: npm run package:linux:deb

      - name: Prepare Launchpad source package
        run: npm run package:ppa-source -- --vendor-npm-cache --vendor-node
        env:
          UBUNTU_SERIES: ${{ matrix.series }}
          DEBFULLNAME: Tangent Maintainers
          DEBEMAIL: maintainers@example.invalid

      - name: Lint source package
        run: lintian dist/ppa-source/${{ matrix.series }}/*.changes || true

      - name: Upload direct .deb
        uses: actions/upload-artifact@v4
        with:
          name: direct-deb-${{ matrix.series }}
          path: apps/tangent-electron/dist/*.deb

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: ppa-source-${{ matrix.series }}
          path: |
            dist/ppa-source/${{ matrix.series }}/*.dsc
            dist/ppa-source/${{ matrix.series }}/*.changes
            dist/ppa-source/${{ matrix.series }}/*.tar.*
